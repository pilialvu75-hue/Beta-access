name: Deploy Beta Access to Cloudflare (manual)
on:
  workflow_dispatch:
    inputs:
      initialize_web_push:
        description: 'First-time setup: configure Android Web Push VAPID keys without exposing secrets'
        type: boolean
        required: false
        default: false
      run_live_smoke:
        description: 'Test real enrollment/approval/revocation without tester distribution'
        type: boolean
        required: false
        default: false
      enable_private_pilot:
        description: 'INVITE ONLY: allow one privately invited tester to request approval, with public downloads still OFF'
        type: boolean
        required: false
        default: false
      enable_tester_download:
        description: 'Enable sharing only AFTER approved gated WEmulDroid release and physical tests'
        type: boolean
        required: true
        default: false
      approved_beta_tag:
        description: 'Exact gated beta tag; leave blank while sharing is off'
        type: string
        required: false
        default: ''
      gated_build_confirmed:
        description: 'I verified gated install, approval and Diagnostics on real devices'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: beta-access-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.BETA_CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.BETA_CF_ACCOUNT_ID }}
      BETA_ADMIN_TOKEN: ${{ secrets.BETA_ADMIN_TOKEN }}
      DIAGNOSTICS_GITHUB_TOKEN: ${{ secrets.DIAGNOSTICS_GITHUB_TOKEN }}
      ENABLE_TESTER_DOWNLOAD: ${{ inputs.enable_tester_download }}
      ENABLE_PRIVATE_PILOT: ${{ inputs.enable_private_pilot }}
      APPROVED_BETA_TAG: ${{ inputs.approved_beta_tag }}
      GATED_BUILD_CONFIRMED: ${{ inputs.gated_build_confirmed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate secrets and public release gate
        shell: bash
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BETA_ADMIN_TOKEN; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing Actions secret $key"; exit 1
            fi
          done
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[a-fA-F0-9]{32}$ ]]; then
            echo "::error::Invalid dedicated Cloudflare Account ID"; exit 1
          fi
          if [[ ${#BETA_ADMIN_TOKEN} -lt 48 ]]; then
            echo "::error::BETA_ADMIN_TOKEN must be 48+ random characters"; exit 1
          fi
          if [[ "$ENABLE_PRIVATE_PILOT" == "true" && "$ENABLE_TESTER_DOWNLOAD" == "true" ]]; then
            echo "::error::Cannot run invite-only pilot and public sharing simultaneously"; exit 1
          fi
          if [[ "$ENABLE_PRIVATE_PILOT" == "true" && -z "$DIAGNOSTICS_GITHUB_TOKEN" ]]; then
            echo "::error::Diagnostics token required for private pilot"; exit 1
          fi
          if [[ "$ENABLE_TESTER_DOWNLOAD" == "true" && "$GATED_BUILD_CONFIRMED" != "true" ]]; then
            echo "::error::Cannot publish unverified gated installer"; exit 1
          fi
          if [[ "$ENABLE_TESTER_DOWNLOAD" == "true" && -z "$DIAGNOSTICS_GITHUB_TOKEN" ]]; then
            echo "::error::Diagnostics token is mandatory before public tester invitations"; exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run check && npm test
      - name: Create or reuse D1 database in EU
        shell: bash
        run: |
          set -euo pipefail
          db_id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "beta-access") | .uuid' | head -1)"
          if [[ -z "$db_id" ]]; then
            npx wrangler d1 create beta-access --jurisdiction eu
            db_id="$(npx wrangler d1 list --json | jq -r '.[] | select(.name == "beta-access") | .uuid' | head -1)"
          fi
          if [[ -z "$db_id" ]]; then echo "::error::D1 missing"; exit 1; fi
          echo "D1_DATABASE_ID=$db_id" >> "$GITHUB_ENV"
      - name: Prepare deployment configuration (no secrets in files)
        run: node scripts/prepare-deploy.mjs
      - name: Migrate remote D1
        run: npx wrangler d1 migrations apply beta-access --remote
      - name: Deploy Worker and set server-only secrets
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy
          printf '%s' "$BETA_ADMIN_TOKEN" | npx wrangler secret put ADMIN_TOKEN
          if [[ -n "${DIAGNOSTICS_GITHUB_TOKEN:-}" ]]; then
            printf '%s' "$DIAGNOSTICS_GITHUB_TOKEN" | npx wrangler secret put DIAGNOSTICS_GITHUB_TOKEN
          fi
      - name: Initialize Android Web Push (first-time only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.initialize_web_push == true }}
        run: node scripts/bootstrap-vapid.mjs
      - name: Live API smoke test — synthetic device only
        if: ${{ (github.event_name == 'push' || inputs.run_live_smoke == true) && inputs.enable_tester_download != true }}
        run: node scripts/live-smoke.mjs
      - name: Summary
        shell: bash
        run: |
          echo "The Worker deploy finished. Get the HTTPS workers.dev URL from your Cloudflare dashboard." >> "$GITHUB_STEP_SUMMARY"
          echo "Do not publish QR links before the gated Windows beta is tested." >> "$GITHUB_STEP_SUMMARY"
